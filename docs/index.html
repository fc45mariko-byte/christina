<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Christina</title>
  <meta name="description" content="A visual system for seeing life accumulate over time.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Christina">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    // Apply saved appearance before the first paint (the same logic as app/core/appearance.js).
    try {
      var a = JSON.parse(localStorage.getItem('christina.appearance') || '{}'), r = document.documentElement;
      if (a.theme && a.theme !== 'system') r.setAttribute('data-theme', a.theme);
      if (a.bg && a.bg !== 'plain') r.setAttribute('data-bg', a.bg);
      if (a.font && a.font !== 'system') r.setAttribute('data-font', a.font);
      if (a.density && a.density !== 'comfortable') r.setAttribute('data-density', a.density);
      if (a.cards && a.cards !== 'filled') r.setAttribute('data-cards', a.cards);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="app/ui/tokens.css">
  <link rel="stylesheet" href="app/ui/base.css">
  <link rel="stylesheet" href="app/ui/components.css">
  <link rel="stylesheet" href="app/modules/body-oracle/body-oracle.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar" aria-label="Sections"></nav>
    <main id="main"></main>
    <nav id="tabbar" aria-label="Tabs"></nav>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheet" class="hidden"></div>
  <!-- Body Oracle module overlays -->
  <div id="bo-sheet" class="m-bo" hidden></div>
  <div id="bo-modal" class="m-bo" hidden></div>
  <div id="bo-radial" hidden></div>
  <script type="module" src="app/main.js"></script>
</body>
</html>
